services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospital-sqlserver
    ports:
      - "1433:1433"
    environment:
      SA_PASSWORD: "${SQLSERVER_PASSWORD}"
      ACCEPT_EULA: "Y"
    volumes:
      - sql_data:/var/opt/mssql
      - ./server/init-database.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - hospital-network
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: hospital-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass "${REDIS_PASSWORD}"
    networks:
      - hospital-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: hospital-backend
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__SqlServerDb=Server=sqlserver,1433;Database=Hospital;User Id=sa;Password=${SQLSERVER_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__RedisConnection=redis:6379,password=${REDIS_PASSWORD:-YourRedisPassword123}
      - JwtSettings__Issuer=hospital.api
      - JwtSettings__Audience=hospital.frontend
      - JwtSettings__Key=${JWT_SECRET_KEY}
      - JwtSettings__ExpiryMinutes=60
      - EmailSettings__Provider=${EMAIL_PROVIDER:-SendGrid}
      - EmailSettings__Smtp__Host=${SMTP_HOST:-smtp.gmail.com}
      - EmailSettings__Smtp__Port=${SMTP_PORT:-587}
      - EmailSettings__Smtp__Username=${SMTP_USERNAME}
      - EmailSettings__Smtp__Password=${SMTP_PASSWORD}
      - EmailSettings__Smtp__From=${SMTP_FROM}
      - EmailSettings__SendGrid__ApiKey=${SENDGRID_API_KEY}
      - EmailSettings__SendGrid__SenderEmail=${SENDGRID_SENDER_EMAIL}
      - EmailSettings__SendGrid__SenderName=${SENDGRID_SENDER_NAME:-Hospital Management}
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hospital-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Frontend Application
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: hospital-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:5000
      - NEXT_PUBLIC_APP_NAME=Hospital Management System
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hospital-network
    restart: unless-stopped

volumes:
  sql_data:
    driver: local

networks:
  hospital-network:
    driver: bridge