name: Deploy Full Stack

on:
  workflow_dispatch:

jobs:
  backend:
    uses: ./.github/workflows/deploy-backend.yml
    secrets: inherit

  frontend:
    needs: backend
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      api_url: https://hospital-backend-api.azurewebsites.net/api
    secrets: inherit

  summary:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# 🚀 Full Stack Deployment" >> $GITHUB_STEP_SUMMARY
          echo "- Backend: ${{ needs.backend.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend: ${{ needs.frontend.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- [Frontend](https://hospital-nextjs-app.azurewebsites.net)" >> $GITHUB_STEP_SUMMARY
          echo "- [Backend](https://hospital-backend-api.azurewebsites.net)" >> $GITHUB_STEP_SUMMARY
