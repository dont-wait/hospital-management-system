name: Build and deploy Node.js app to Azure Web App - hospital-nextjs-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Build Next.js standalone
        working-directory: ./client
        run: yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Prepare deployment package
        working-directory: ./client
        run: |
          mkdir -p deploy
          
          # BƯỚC 1: Copy TOÀN BỘ standalone (có server.js, node_modules, etc.)
          cp -r .next/standalone/* deploy/
          cp -r .next/standalone/.* deploy/ 2>/dev/null || true
          
          # BƯỚC 2: Tạo thư mục .next trong deploy (nếu chưa có)
          mkdir -p deploy/.next
          
          # BƯỚC 3: Copy static assets vào đúng chỗ
          cp -r .next/static deploy/.next/static
          
          # BƯỚC 4: Copy public (nếu có)
          [ -d "public" ] && cp -r public deploy/public || true
          
          # BƯỚC 5: Copy BUILD_ID (quan trọng!)
          cp .next/BUILD_ID deploy/.next/BUILD_ID
          
          # Quick verify
          ls -la deploy/
          ls -la deploy/.next/

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: client/deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        run: |
          zip -r deploy.zip . -x "*.git*"
          az webapp deployment source config-zip \
            --resource-group hospital-rg \
            --name hospital-nextjs-app \
            --src deploy.zip \
            --timeout 600

      - name: Configure Azure Web App
        run: |
          az webapp config appsettings set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --settings \
              NODE_ENV="production" \
              NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
              PORT="8080" \
              WEBSITES_PORT="8080" \
              SCM_DO_BUILD_DURING_DEPLOYMENT="false"

          az webapp config set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --startup-file "node server.js"

          az webapp restart \
            --name hospital-nextjs-app \
            --resource-group hospital-rg