name: Build and deploy Node.js app to Azure Web App - hospital-nextjs-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Check project structure
        run: |
          echo "Repository root structure:"
          ls -la
          echo ""
          echo "Checking client directory:"
          if [ -d "client" ]; then
            echo "✓ client directory found"
            ls -la client/
          else
            echo "✗ client directory NOT found"
            exit 1
          fi

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          echo "Yarn version:"
          yarn -v

      - name: Check client files
        working-directory: ./client
        run: |
          echo "Checking for package.json and yarn.lock:"
          if [ -f "package.json" ]; then
            echo "✓ package.json found"
          else
            echo "✗ package.json NOT found"
            exit 1
          fi
          if [ -f "yarn.lock" ]; then
            echo "✓ yarn.lock found"
          else
            echo "✗ yarn.lock NOT found"
            exit 1
          fi

      - name: Install dependencies
        working-directory: ./client
        run: yarn install --frozen-lockfile

      - name: Build Next.js standalone
        working-directory: ./client
        run: yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Prepare deployment package
        working-directory: ./client
        run: |
          echo "Creating deployment package..."
          mkdir -p deploy
          
          # Copy standalone build
          echo "Copying standalone files..."
          cp -r .next/standalone/* deploy/
          
          # Copy static assets
          echo "Copying static assets..."
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/
          
          # Copy public folder if exists
          if [ -d "public" ]; then
            echo "Copying public folder..."
            cp -r public deploy/public
          fi
          
          # Create package.json for Azure
          echo "Creating package.json..."
          cat > deploy/package.json << 'EOF'
          {
            "name": "hospital-nextjs-app",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "20.x"
            }
          }
          EOF
          
          # Verify structure
          echo ""
          echo "Deployment package structure:"
          ls -la deploy/
          echo ""
          echo "Checking server.js:"
          if [ -f "deploy/server.js" ]; then
            echo "✓ server.js exists"
          else
            echo "✗ server.js NOT found - BUILD FAILED!"
            exit 1
          fi

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: client/deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify downloaded artifact
        run: |
          echo "Downloaded files:"
          ls -la
          echo ""
          if [ ! -f "server.js" ]; then
            echo "✗ ERROR: server.js not found!"
            exit 1
          fi
          echo "✓ server.js found"
          if [ ! -f "package.json" ]; then
            echo "✗ ERROR: package.json not found!"
            exit 1
          fi
          echo "✓ package.json found"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hospital-nextjs-app'
          slot-name: 'Production'
          package: .

      - name: Set App Settings & Startup
        run: |
          echo "Configuring app settings..."
          az webapp config appsettings set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --settings \
              NODE_ENV="production" \
              NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" \
              PORT="8080" \
              WEBSITES_PORT="8080"

          echo "Setting startup command..."
          az webapp config set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --startup-file "node server.js"

          echo "Restarting app..."
          az webapp restart \
            --name hospital-nextjs-app \
            --resource-group hospital-rg

      - name: Wait for restart
        run: |
          echo "Waiting 30 seconds for app to restart..."
          sleep 30

      - name: Check deployment status
        run: |
          echo "Checking app state..."
          STATE=$(az webapp show \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --query state \
            --output tsv)
          echo "App state: $STATE"
          
          if [ "$STATE" != "Running" ]; then
            echo "✗ WARNING: App is not in Running state!"
          else
            echo "✓ App is Running"
          fi