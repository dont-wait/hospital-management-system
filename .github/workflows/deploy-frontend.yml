name: Deploy Frontend App

on:
  workflow_call:
    inputs:
      api_url:
        required: true
        type: string
    secrets:
      AZURE_CREDENTIALS:
        required: true
      NEXT_PUBLIC_API_BASE_URL:
        required: true

env:
  AZURE_WEBAPP_NAME: hospital-nextjs-app
  NODE_VERSION: '22.x'
  WORKING_DIRECTORY: ./client

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate

      - name: Install dependencies
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          yarn install --immutable

      - name: Build Next.js app
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.api_url }}
          NEXT_PUBLIC_APP_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
          NODE_ENV: production

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_CREDENTIALS }}
          package: ${{ env.WORKING_DIRECTORY }}/.next/standalone

      - name: Health Check
        run: |
          sleep 30
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
          if [ $HTTP_CODE -ne 200 ]; then
            echo "Frontend health check failed"
            exit 1
