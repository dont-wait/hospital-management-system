name: Deploy Frontend App

on:
  workflow_call:
    inputs:
      NEXT_PUBLIC_API_BASE_URL:
        required: true
        type: string

env:
  AZURE_WEBAPP_NAME: hospital-nextjs-app
  NODE_VERSION: '22.x'
  WORKING_DIRECTORY: ./client

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      - name: Install dependencies
        run: cd ${{ env.WORKING_DIRECTORY }} && yarn install --immutable

      - name: Build Next.js
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_APP_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
          NODE_ENV: production

      - name: Package for Azure
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          
          echo "📦 Preparing standalone deployment..."
          mkdir -p deploy
          
          # Copy standalone build (includes server.js and .next)
          cp -r .next/standalone/* deploy/
          
          # Copy static assets into standalone's .next folder
          cp -r .next/static deploy/.next/static
          
          # Copy public folder if exists
          if [ -d "public" ]; then
            cp -r public deploy/public
          fi
          
          # Verify structure
          echo "✅ Verifying deployment structure:"
          ls -la deploy/
          echo ""
          echo "📁 .next folder contents:"
          ls -la deploy/.next/ || echo "⚠️ .next missing!"
          echo ""
          echo "📄 server.js:"
          test -f deploy/server.js && echo "✅ Found" || echo "❌ Missing!"
          
          cat > deploy/package.json << 'EOF'
          {
            "name": "hospital-nextjs-app",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "22.x"
            }
          }
          EOF

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CLIENT }}
          package: ${{ env.WORKING_DIRECTORY }}/deploy

      - name: Set App Settings
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg \
            --settings \
              NODE_ENV="production" \
              NEXT_PUBLIC_API_BASE_URL="${{ inputs.NEXT_PUBLIC_API_BASE_URL }}" \
              PORT="8080" \
              WEBSITES_PORT="8080"
          
          # Set startup command
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg \
            --startup-file "node server.js"
          
          # Restart to apply config
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg

      - name: Health Check
        run: |
          for i in {1..12}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
            if [ "$code" = "200" ]; then
              echo "Frontend healthy"
              exit 0
            fi
            echo "Waiting for frontend..."
            sleep 10
          done
          echo "⚠️ Frontend did not start in time"
          exit 1
