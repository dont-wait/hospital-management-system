name: Deploy Frontend App

on:
  workflow_call:
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hospital-nextjs-app
  NODE_VERSION: '22.x'
  WORKING_DIRECTORY: ./client

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Frontend App

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack & Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      - name: Cache Yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.WORKING_DIRECTORY }}/.yarn/cache
            ${{ env.WORKING_DIRECTORY }}/.yarn/install-state.gz
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install dependencies
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          yarn install --immutable

      - name: Build Next.js app
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_APP_URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
          NODE_ENV: production

      - name: 📦 Prepare package for deployment
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          
          mkdir -p deploy
          cp -r .next/standalone/* deploy/
          mkdir -p deploy/.next/static
          cp -r .next/static/* deploy/.next/static/
          
          if [ -d "public" ]; then
            cp -r public deploy/public
          fi
          
          # Create a startup wrapper script
          cat > deploy/startup.sh << 'EOF'
          #!/bin/sh
          echo "Starting Next.js application..."
          echo "Node version: $(node --version)"
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la
          echo "PORT environment variable: $PORT"
          echo "Starting server on port ${PORT:-8080}"
          node server.js
          EOF
          
          chmod +x deploy/startup.sh
          
          cat > deploy/package.json << 'EOF'
          {
            "name": "hospital-nextjs-app",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "22.x"
            }
          }
          EOF
          
          # Verify deployment structure
          echo "📦 Deployment structure:"
          ls -la deploy/
          echo ""
          echo "📄 server.js exists:"
          test -f deploy/server.js && echo "✅ Yes" || echo "❌ No"
          echo ""
          echo "📁 .next folder:"
          ls -la deploy/.next/ || echo "❌ .next folder missing!"

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_CLIENT }}
          package: ${{ env.WORKING_DIRECTORY }}/deploy

      - name: Set App Settings / Runtime Secrets
        run: |
          # Set environment variables
          az webapp config appsettings set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg \
            --settings \
              NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }} \
              WEBSITE_NODE_DEFAULT_VERSION="22-lts" \
              NODE_ENV="production" \
              PORT="8080" \
              WEBSITES_PORT="8080"
          
          # Set startup command (Azure expects app to listen on PORT env variable)
          az webapp config set \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg \
            --startup-file "node server.js"
          
          # Enable logging
          az webapp log config \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg \
            --application-logging filesystem \
            --detailed-error-messages true \
            --web-server-logging filesystem
          
          # Restart app to apply changes
          echo "Restarting app to apply configuration..."
          az webapp restart \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --resource-group hospital-rg

      - name: 🔍 Check Azure App Logs
        if: always()
        run: |
          echo "Fetching application logs..."
          az webapp log tail --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group hospital-rg --only-show-errors || true
          
          echo ""
          echo "Checking app settings..."
          az webapp config appsettings list --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group hospital-rg || true

      - name: Verify Deployment
        run: |
          echo "⏳ Waiting for app to start..."
          MAX_RETRIES=12
          RETRY_DELAY=20
          
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."
            
            # Try health endpoint first
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/health)
            
            echo "Health Check: $HTTP_CODE"
            
            # If health fails, try homepage
            if [ $HTTP_CODE -ne 200 ]; then
              echo "Health endpoint failed, trying homepage..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)
              echo "Homepage Check: $HTTP_CODE"
            fi
            
            if [ $HTTP_CODE -eq 200 ]; then
              echo "✅ Frontend deployed successfully!"
              echo "🌐 URL: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net"
              exit 0
            fi
            
            if [ $i -lt $MAX_RETRIES ]; then
              echo "Service not ready, waiting ${RETRY_DELAY}s before retry..."
              sleep $RETRY_DELAY
            fi
          done
          
          echo "❌ Deployment verification failed after $MAX_RETRIES attempts!"
          echo "Fetching recent logs for debugging..."
          az webapp log download --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group hospital-rg --log-file app-logs.zip || true
          exit 1

      - name: 📊 Deployment Summary
        if: always()
        run: |
          echo "# 🎨 Frontend App Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [App](https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net)" >> $GITHUB_STEP_SUMMARY
