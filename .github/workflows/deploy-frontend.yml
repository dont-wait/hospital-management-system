name: Deploy Frontend App

on:
  workflow_call:
    inputs:
      NEXT_PUBLIC_API_BASE_URL:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Enable Corepack & Yarn
        run: |
          corepack enable
          corepack prepare yarn@stable --activate
          yarn -v

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Next.js standalone
        run: |
          yarn build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Prepare deployment package
        run: |
          mkdir -p deploy/.next
          cp -r .next/standalone/* deploy/
          cp -r .next/static deploy/.next/static
          [ -d public ] && cp -r public deploy/public
          
          # Minimal package.json for Azure
          cat > deploy/package.json << 'EOF'
          {
            "name": "hospital-nextjs-app",
            "version": "1.0.0",
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "20.x"
            }
          }
          EOF

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hospital-nextjs-app'
          slot-name: 'Production'
          package: deploy/

      - name: Set App Settings & Startup
        run: |
          az webapp config appsettings set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --settings NODE_ENV="production" NEXT_PUBLIC_API_BASE_URL="${{ secrets.NEXT_PUBLIC_API_BASE_URL }}" PORT="8080" WEBSITES_PORT="8080"

          az webapp config set \
            --name hospital-nextjs-app \
            --resource-group hospital-rg \
            --startup-file "node server.js"

          az webapp restart \
            --name hospital-nextjs-app \
            --resource-group hospital-rg
