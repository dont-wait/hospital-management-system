name: Deploy Hospital API to Azure (Student)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
      - '.github/workflows/deployapi.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: hospital-backend-api
  DOTNET_VERSION: '8.0.x'
  WORKING_DIRECTORY: ./server

jobs:
  build-and-test:
    runs-on: ubuntu-20.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET ${{ env.DOTNET_VERSION }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet restore

    - name: Build
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet build --configuration Release --no-restore

    - name: Run Unit Tests
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet test HospitalManagement.Tests/HospitalManagement.Tests.csproj \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx"

    - name: Publish Application
      run: |
        cd ${{ env.WORKING_DIRECTORY }}
        dotnet publish WebApi/WebApi.csproj \
          --configuration Release \
          --output ./publish \
          --no-build

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: hospital-api
        path: ${{ env.WORKING_DIRECTORY }}/publish

  deploy:
    runs-on: ubuntu-20.04
    needs: build-and-test
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: hospital-api

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: .

    - name: Health Check
      run: |
        echo "Checking API health..."
        sleep 30
        response=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.deploy-to-webapp.outputs.webapp-url }}/health || echo "000")
        if [ "$response" = "200" ]; then
          echo "✅ API is healthy"
        else
          echo "⚠️ Health check returned: $response (Free tier may take longer to start)"
        fi