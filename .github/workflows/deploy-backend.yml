name: Deploy Backend API to Azure

on:
  workflow_call:
    outputs:
      status:
        description: 'Backend deploy status'
        value: ${{ steps.deploy.outputs.status }}

env:
  AZURE_WEBAPP_NAME: hospital-backend-api
  DOTNET_VERSION: '8.0.x'
  WORKING_DIRECTORY: ./server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build & Publish
        run: |
          cd ${{ env.WORKING_DIRECTORY }}
          dotnet restore
          dotnet build --configuration Release --no-restore
          dotnet publish WebApi/WebApi.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure
        id: deploy
        run: |
          cd ${{ env.WORKING_DIRECTORY }}/publish
          zip -r ../deploy.zip .
          cd ..
          az webapp deployment source config-zip \
            --resource-group hospital-rg \
            --name ${{ env.AZURE_WEBAPP_NAME }} \
            --src deploy.zip
          echo "status=success" >> $GITHUB_OUTPUT

      - name: Health Check
        run: |
          sleep 60
          response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || echo "000")
          if [ "$response" != "200" ]; then
            echo "Backend health check failed"
            exit 1
